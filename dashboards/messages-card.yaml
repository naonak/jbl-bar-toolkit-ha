# JBL Bar Toolkit – messages card.
# In a dashboard: Edit > Add card > Manual, then paste.
# It needs the package messages-package.yaml. It finds the bar's entities
# itself: no entity id to adapt, whatever Home Assistant's language.
type: vertical-stack
cards:
  - type: entities
    title: Messages
    entities:
      - type: conditional
        conditions:
          - condition: state
            entity: button.jbl_message_line_1
            state: unavailable
        row:
          type: text
          icon: mdi:message-off-outline
          name: No message on the bar
          text: "–"
      - type: conditional
        conditions:
          - condition: state
            entity: button.jbl_message_line_1
            state_not: unavailable
        row:
          entity: button.jbl_message_line_1
      - type: conditional
        conditions:
          - condition: state
            entity: button.jbl_message_line_2
            state_not: unavailable
        row:
          entity: button.jbl_message_line_2
      - type: conditional
        conditions:
          - condition: state
            entity: button.jbl_message_line_3
            state_not: unavailable
        row:
          entity: button.jbl_message_line_3
      - type: conditional
        conditions:
          - condition: state
            entity: button.jbl_message_line_4
            state_not: unavailable
        row:
          entity: button.jbl_message_line_4
      - type: conditional
        conditions:
          - condition: state
            entity: button.jbl_message_line_5
            state_not: unavailable
        row:
          entity: button.jbl_message_line_5
      - type: conditional
        conditions:
          - condition: state
            entity: button.jbl_message_line_6
            state_not: unavailable
        row:
          entity: button.jbl_message_line_6
      - type: conditional
        conditions:
          - condition: state
            entity: button.jbl_message_line_7
            state_not: unavailable
        row:
          entity: button.jbl_message_line_7
      - type: conditional
        conditions:
          - condition: state
            entity: button.jbl_message_line_8
            state_not: unavailable
        row:
          entity: button.jbl_message_line_8
  - type: markdown
    show_empty: false
    content: |
      {%- set source = expand(integration_entities('jbl_bar_91'))
         | selectattr('attributes.messages', 'defined') | list %}
      {%- if source | count == 0 %}
      ⚠️ No *Messages* entity: the toolkit remote on the bar has no Messages
      panel yet. Update it; the integration adds the messages by itself.
      {%- elif states.input_text.jbl_message_text is none %}
      ⚠️ The messages package is missing: put messages-package.yaml in your
      packages folder, then restart Home Assistant (see the README).
      {%- else %}
      {%- set n = source[0].attributes.messages | count %}
      {%- if n > 8 %}
      And {{ n - 8 }} more: *Clear all messages* clears them too.
      {%- endif %}
      {%- endif %}
  - type: entities
    title: Leave a message
    entities:
      - input_text.jbl_message_text
      - input_select.jbl_message_length
      - input_boolean.jbl_message_clear_on_key
      - type: button
        name: Show on the bar
        icon: mdi:message-arrow-right-outline
        action_name: Show
        tap_action:
          action: perform-action
          perform_action: script.jbl_message_send
      - type: conditional
        conditions:
          - condition: state
            entity: switch.jbl_display_clock
            state: ["on", "off"]
        row:
          entity: switch.jbl_display_clock
      - type: conditional
        conditions:
          - condition: state
            entity: select.jbl_display_clock_when
            state: ["standby", "always"]
        row:
          entity: select.jbl_display_clock_when
      - type: conditional
        conditions:
          - condition: state
            entity: switch.jbl_display_clock
            state: ["on", "off"]
        row:
          entity: input_boolean.jbl_clock_scheduled
      - type: conditional
        conditions:
          - condition: state
            entity: switch.jbl_display_clock
            state: ["on", "off"]
        row:
          entity: input_datetime.jbl_clock_from
      - type: conditional
        conditions:
          - condition: state
            entity: switch.jbl_display_clock
            state: ["on", "off"]
        row:
          entity: input_datetime.jbl_clock_until
  - type: grid
    columns: 1
    square: false
    cards:
      - type: button
        name: Clear all messages
        icon: mdi:message-off-outline
        tap_action:
          action: perform-action
          perform_action: script.jbl_message_clear_all
          confirmation:
            text: Clear all messages?
