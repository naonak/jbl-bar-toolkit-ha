# JBL Bar Toolkit – messages on the front display: helpers and scripts for messages-card.yaml.
# Put this file in your packages folder (like timers-package.yaml), for example
# /config/packages/jbl_messages.yaml, then restart Home Assistant. The scripts
# find the bar themselves: no entity id to adapt.
# sensor.jbl_message_1 to _4 are the messages on the bar, one each, in the
# order the bar shows them, for the card's Clear buttons. Unavailable when
# empty. The *name, *state… lines reuse the first sensor's templates.
template:
  - sensor:
      - unique_id: jbl_message_1
        default_entity_id: sensor.jbl_message_1
        variables: {slot: 1}
        name: &name >-
          {%- set all = expand(integration_entities('jbl_bar_91'))
             | selectattr('attributes.messages', 'defined') | map(attribute='attributes.messages') | first | default([]) %}
          {%- set m = all[slot - 1] if all | count >= slot else none %}
          {%- if m is none %}Message {{ slot }}
          {%- else %}
          {{- m.text }}{{ ' (' ~ m.name ~ ')' if m.name }} – {{ 'showing' if m.showing else 'waiting' }},
          {%- if m.mode == 'forever' %} until cleared
          {%- elif m.mode == 'duration' and m.ends_at %} until {{ as_timestamp(m.ends_at) | timestamp_custom('%H:%M') }}
          {%- elif m.passes_left == 1 %} last time
          {%- else %} {{ m.passes_left }} times left
          {%- endif %}
          {%- endif %}
        state: &state >-
          {%- set all = expand(integration_entities('jbl_bar_91'))
             | selectattr('attributes.messages', 'defined') | map(attribute='attributes.messages') | first | default([]) %}
          {{ ('showing' if all[slot - 1].showing else 'waiting') if all | count >= slot else none }}
        availability: &availability >-
          {{ expand(integration_entities('jbl_bar_91'))
             | selectattr('attributes.messages', 'defined') | map(attribute='attributes.messages') | first | default([])
             | count >= slot }}
        icon: &icon >-
          {%- set all = expand(integration_entities('jbl_bar_91'))
             | selectattr('attributes.messages', 'defined') | map(attribute='attributes.messages') | first | default([]) %}
          {{ 'mdi:message-text' if all | count >= slot and all[slot - 1].showing else 'mdi:message-text-clock-outline' }}
        attributes:
          message_id: &message_id >-
            {%- set all = expand(integration_entities('jbl_bar_91'))
               | selectattr('attributes.messages', 'defined') | map(attribute='attributes.messages') | first | default([]) %}
            {{ all[slot - 1].id if all | count >= slot else '' }}
      - unique_id: jbl_message_2
        default_entity_id: sensor.jbl_message_2
        variables: {slot: 2}
        name: *name
        state: *state
        availability: *availability
        icon: *icon
        attributes:
          message_id: *message_id
      - unique_id: jbl_message_3
        default_entity_id: sensor.jbl_message_3
        variables: {slot: 3}
        name: *name
        state: *state
        availability: *availability
        icon: *icon
        attributes:
          message_id: *message_id
      - unique_id: jbl_message_4
        default_entity_id: sensor.jbl_message_4
        variables: {slot: 4}
        name: *name
        state: *state
        availability: *availability
        icon: *icon
        attributes:
          message_id: *message_id
input_text:
  jbl_message_text:
    name: Message
    max: 31
input_select:
  jbl_message_length:
    name: Show it
    options:
      - Until cleared
      - Once
      - 3 times
      - 5 min
      - 15 min
      - 1 hour
    initial: Until cleared
input_boolean:
  jbl_message_clear_on_key:
    name: Clear with a key on the JBL remote
    initial: true
script:
  jbl_message_send:
    alias: Leave the message
    icon: mdi:message-arrow-right-outline
    variables:
      bar: >-
        {{ integration_entities('jbl_bar_91') | select('match', 'media_player[.]') | first }}
      text: "{{ states('input_text.jbl_message_text') | trim }}"
      length: "{{ states('input_select.jbl_message_length') }}"
      key: "{{ is_state('input_boolean.jbl_message_clear_on_key', 'on') }}"
    sequence:
      - condition: template
        value_template: "{{ text != '' }}"
      - choose:
          - conditions: "{{ length == 'Once' or length == '3 times' }}"
            sequence:
              - action: jbl_bar_91.display_message
                target:
                  entity_id: "{{ bar }}"
                data:
                  message: "{{ text }}"
                  repeat: "{{ 1 if length == 'Once' else 3 }}"
                  clear_on_key: "{{ key }}"
          - conditions: "{{ length in ['5 min', '15 min', '1 hour'] }}"
            sequence:
              - action: jbl_bar_91.display_message
                target:
                  entity_id: "{{ bar }}"
                data:
                  message: "{{ text }}"
                  duration:
                    minutes: "{{ {'5 min': 5, '15 min': 15, '1 hour': 60}[length] }}"
                  clear_on_key: "{{ key }}"
        default:
          - action: jbl_bar_91.display_message
            target:
              entity_id: "{{ bar }}"
            data:
              message: "{{ text }}"
              forever: true
              clear_on_key: "{{ key }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.jbl_message_text
        data:
          value: ""
  jbl_message_clear_unnamed:
    alias: Clear the unnamed message
    icon: mdi:message-minus-outline
    sequence:
      - action: jbl_bar_91.display_cancel
        target:
          entity_id: >-
            {{ integration_entities('jbl_bar_91') | select('match', 'media_player[.]') | first }}
        data:
          id: default
  jbl_message_clear_all:
    alias: Clear all messages
    icon: mdi:message-off-outline
    sequence:
      - action: jbl_bar_91.display_cancel
        target:
          entity_id: >-
            {{ integration_entities('jbl_bar_91') | select('match', 'media_player[.]') | first }}
  jbl_message_cancel_slot:
    alias: Clear one message
    icon: mdi:message-minus-outline
    fields:
      slot:
        name: Line
        description: The number of sensor.jbl_message_N, as on the card's line.
        required: true
        selector:
          number: {min: 1, max: 4}
    sequence:
      - variables:
          message_id: "{{ state_attr('sensor.jbl_message_' ~ (slot | int(0)), 'message_id') }}"
      - condition: template
        value_template: "{{ message_id not in [none, ''] }}"
      - action: jbl_bar_91.display_cancel
        target:
          entity_id: >-
            {{ integration_entities('jbl_bar_91') | select('match', 'media_player[.]') | first }}
        data:
          id: "{{ message_id }}"
