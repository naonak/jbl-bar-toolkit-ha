# JBL Bar Toolkit – messages on the front display: helpers and scripts for messages-card.yaml.
# Put this file in your packages folder (like timers-package.yaml), for example
# /config/packages/jbl_messages.yaml, then restart Home Assistant. The scripts
# find the bar themselves: no entity id to adapt.

input_text:
  jbl_message_text:
    name: Message
    max: 31
input_select:
  jbl_message_length:
    name: Show it
    options:
      - Until cleared
      - Once
      - 3 times
      - 5 min
      - 15 min
      - 1 hour
    initial: Until cleared
input_boolean:
  jbl_clock_scheduled:
    name: Clock on a schedule
    icon: mdi:clock-time-eight-outline
  jbl_message_clear_on_key:
    name: Clear with a key on the JBL remote
    initial: true
input_datetime:
  jbl_clock_from:
    name: Clock from
    has_date: false
    has_time: true
  jbl_clock_until:
    name: Clock until
    has_date: false
    has_time: true
script:
  jbl_message_send:
    alias: Leave the message
    icon: mdi:message-arrow-right-outline
    variables:
      bar: >-
        {{ integration_entities('jbl_bar_91') | select('match', 'media_player[.]') | first }}
      text: "{{ states('input_text.jbl_message_text') | trim }}"
      length: "{{ states('input_select.jbl_message_length') }}"
      key: "{{ is_state('input_boolean.jbl_message_clear_on_key', 'on') }}"
    sequence:
      - condition: template
        value_template: "{{ text != '' }}"
      - choose:
          - conditions: "{{ length == 'Once' or length == '3 times' }}"
            sequence:
              - action: jbl_bar_91.display_message
                target:
                  entity_id: "{{ bar }}"
                data:
                  message: "{{ text }}"
                  repeat: "{{ 1 if length == 'Once' else 3 }}"
                  clear_on_key: "{{ key }}"
          - conditions: "{{ length in ['5 min', '15 min', '1 hour'] }}"
            sequence:
              - action: jbl_bar_91.display_message
                target:
                  entity_id: "{{ bar }}"
                data:
                  message: "{{ text }}"
                  duration:
                    minutes: "{{ {'5 min': 5, '15 min': 15, '1 hour': 60}[length] }}"
                  clear_on_key: "{{ key }}"
        default:
          - action: jbl_bar_91.display_message
            target:
              entity_id: "{{ bar }}"
            data:
              message: "{{ text }}"
              forever: true
              clear_on_key: "{{ key }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.jbl_message_text
        data:
          value: ""

  jbl_message_clear_all:
    alias: Clear all messages
    icon: mdi:message-off-outline
    sequence:
      - action: jbl_bar_91.display_cancel
        target:
          entity_id: >-
            {{ integration_entities('jbl_bar_91') | select('match', 'media_player[.]') | first }}
# Clock on a schedule: with "Clock on a schedule" on, the bar's standby clock
# (switch.jbl_display_clock, toolkit remote with the clock) is on from "Clock
# from" to "Clock until", every day; the same time in both = all day. Over
# midnight works (22:00 to 07:00). Turning the schedule off leaves the clock as
# it is. It acts at those two times and when the schedule is changed, never
# when Home Assistant starts: a clock turned off by hand stays off until the
# next time. A bar out of reach at that time gets it once back.
automation:
  - id: jbl_clock_schedule
    alias: "JBL clock on a schedule"
    mode: restart
    triggers:
      - trigger: time
        at: input_datetime.jbl_clock_from
      - trigger: time
        at: input_datetime.jbl_clock_until
      - trigger: state
        entity_id:
          - input_boolean.jbl_clock_scheduled
          - input_datetime.jbl_clock_from
          - input_datetime.jbl_clock_until
    conditions:
      - condition: state
        entity_id: input_boolean.jbl_clock_scheduled
        state: "on"
      # A changed setting, not a helper set up again (reload): that has no previous state.
      - condition: template
        value_template: "{{ trigger.platform != 'state' or trigger.from_state is not none }}"
    actions:
      # The bar out of reach (unplugged, restarting): wait for it, until the next time.
      - wait_template: "{{ states('switch.jbl_display_clock') in ['on', 'off'] }}"
        timeout: "24:00:00"
        continue_on_timeout: false
      - variables:
          start: "{{ states('input_datetime.jbl_clock_from') }}"
          end: "{{ states('input_datetime.jbl_clock_until') }}"
          now_: "{{ now().strftime('%H:%M:%S') }}"
          inside: >-
            {{ start == end or (start <= now_ < end if start < end else (now_ >= start or now_ < end)) }}
      - action: "switch.turn_{{ 'on' if inside else 'off' }}"
        target:
          entity_id: switch.jbl_display_clock
