# JBL Bar Toolkit – timers: helpers and scripts for timers-card.yaml.
# Put this file in your packages folder, for example
# /config/packages/jbl_timers.yaml, with in configuration.yaml:
#   homeassistant:
#     packages: !include_dir_named packages
# then restart Home Assistant. The scripts find the bar themselves: no entity
# id to adapt, whatever Home Assistant's language.

input_text:
  jbl_timer_name:
    name: Timer name
    max: 31
input_number:
  jbl_timer_minutes:
    name: Minutes
    min: 1
    max: 120
    step: 1
    initial: 10
    mode: box
input_select:
  jbl_timer_sound:
    name: Sound at the end
    options:
      - Unless watching TV
      - Always
      - "Off"
    initial: Unless watching TV
input_boolean:
  jbl_timer_show_time:
    name: Show the time left on the bar
script:
  jbl_timer_start:
    alias: Start the custom timer
    icon: mdi:timer-play-outline
    sequence:
      - action: jbl_bar_91.timer_start
        target:
          entity_id: >-
            {{ integration_entities('jbl_bar_91') | select('match', 'media_player[.]') | first }}
        data:
          duration:
            minutes: "{{ states('input_number.jbl_timer_minutes') | int(10) }}"
          name: "{{ states('input_text.jbl_timer_name') }}"
          show_time_left: "{{ is_state('input_boolean.jbl_timer_show_time', 'on') }}"
          sound: >-
            {{ {'Unless watching TV': 'unless_tv', 'Always': 'always'}.get(states('input_select.jbl_timer_sound'), 'off') }}
  jbl_timer_quick:
    alias: Quick timer
    icon: mdi:timer-outline
    fields:
      minutes:
        name: Minutes
        required: true
        selector:
          number: {min: 1, max: 720}
    sequence:
      - action: jbl_bar_91.timer_start
        target:
          entity_id: >-
            {{ integration_entities('jbl_bar_91') | select('match', 'media_player[.]') | first }}
        data:
          duration:
            minutes: "{{ minutes | int(1) }}"
          sound: unless_tv
  jbl_timer_stop_all:
    alias: Stop all timers
    icon: mdi:timer-off-outline
    sequence:
      - action: jbl_bar_91.timer_cancel
        target:
          entity_id: >-
            {{ integration_entities('jbl_bar_91') | select('match', 'media_player[.]') | first }}
        data:
          all: true
  jbl_timer_add_minute:
    alias: Add a minute to the next timer
    icon: mdi:timer-plus-outline
    sequence:
      - action: jbl_bar_91.timer_extend
        target:
          entity_id: >-
            {{ integration_entities('jbl_bar_91') | select('match', 'media_player[.]') | first }}
