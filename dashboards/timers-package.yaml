# JBL Bar Toolkit – timers: helpers and scripts for timers-card.yaml.
# Put this file in your packages folder, for example
# /config/packages/jbl_timers.yaml, with in configuration.yaml:
#   homeassistant:
#     packages: !include_dir_named packages
# then restart Home Assistant. The scripts find the bar themselves: no entity
# id to adapt, whatever Home Assistant's language.
# sensor.jbl_timer_1 to _4 are the running timers, one each, first to end first
# (a ringing one on top), for the card's Cancel buttons. Unavailable when empty.
# The *name, *state… lines reuse the first sensor's templates.
template:
  - sensor:
      - unique_id: jbl_timer_1
        default_entity_id: sensor.jbl_timer_1
        variables: {slot: 1}
        device_class: timestamp
        name: &name >-
          {%- set all = expand(integration_entities('jbl_bar_91'))
             | selectattr('attributes.timers', 'defined') | map(attribute='attributes.timers') | first | default([]) %}
          {%- set t = all[slot - 1] if all | count >= slot else none %}
          {%- if t is none %}Timer {{ slot }}
          {%- elif t.ringing %}🔔 {{ t.name or 'Timer' }} – ringing
          {%- else %}
          {%- set left = ((as_timestamp(t.ends_at) - as_timestamp(now())) / 60) | round(0, 'ceil') | int %}
          {{- t.name or 'Timer' }} – ends at {{ as_timestamp(t.ends_at) | timestamp_custom('%H:%M') }}
          ({{ 'less than a minute' if left < 1 else 'in ' ~ left ~ ' min' }})
          {%- endif %}
        state: &state >-
          {%- set all = expand(integration_entities('jbl_bar_91'))
             | selectattr('attributes.timers', 'defined') | map(attribute='attributes.timers') | first | default([]) %}
          {{ all[slot - 1].ends_at if all | count >= slot else none }}
        availability: &availability >-
          {{ expand(integration_entities('jbl_bar_91'))
             | selectattr('attributes.timers', 'defined') | map(attribute='attributes.timers') | first | default([])
             | count >= slot }}
        icon: &icon >-
          {%- set all = expand(integration_entities('jbl_bar_91'))
             | selectattr('attributes.timers', 'defined') | map(attribute='attributes.timers') | first | default([]) %}
          {{ 'mdi:bell-ring' if all | count >= slot and all[slot - 1].ringing else 'mdi:timer-outline' }}
        attributes:
          timer_id: &timer_id >-
            {%- set all = expand(integration_entities('jbl_bar_91'))
               | selectattr('attributes.timers', 'defined') | map(attribute='attributes.timers') | first | default([]) %}
            {{ all[slot - 1].id if all | count >= slot else '' }}
      - unique_id: jbl_timer_2
        default_entity_id: sensor.jbl_timer_2
        variables: {slot: 2}
        device_class: timestamp
        name: *name
        state: *state
        availability: *availability
        icon: *icon
        attributes:
          timer_id: *timer_id
      - unique_id: jbl_timer_3
        default_entity_id: sensor.jbl_timer_3
        variables: {slot: 3}
        device_class: timestamp
        name: *name
        state: *state
        availability: *availability
        icon: *icon
        attributes:
          timer_id: *timer_id
      - unique_id: jbl_timer_4
        default_entity_id: sensor.jbl_timer_4
        variables: {slot: 4}
        device_class: timestamp
        name: *name
        state: *state
        availability: *availability
        icon: *icon
        attributes:
          timer_id: *timer_id
input_text:
  jbl_timer_name:
    name: Timer name
    max: 31
input_number:
  jbl_timer_minutes:
    name: Minutes
    min: 1
    max: 120
    step: 1
    initial: 10
    mode: box
input_select:
  jbl_timer_sound:
    name: Sound at the end
    options:
      - Unless watching TV
      - Always
      - "Off"
    initial: Unless watching TV
input_boolean:
  jbl_timer_show_time:
    name: Show the time left on the bar
script:
  jbl_timer_start:
    alias: Start the custom timer
    icon: mdi:timer-play-outline
    sequence:
      - action: jbl_bar_91.timer_start
        target:
          entity_id: >-
            {{ integration_entities('jbl_bar_91') | select('match', 'media_player[.]') | first }}
        data:
          duration:
            minutes: "{{ states('input_number.jbl_timer_minutes') | int(10) }}"
          name: "{{ states('input_text.jbl_timer_name') }}"
          show_time_left: "{{ is_state('input_boolean.jbl_timer_show_time', 'on') }}"
          sound: >-
            {{ {'Unless watching TV': 'unless_tv', 'Always': 'always'}.get(states('input_select.jbl_timer_sound'), 'off') }}
  jbl_timer_quick:
    alias: Quick timer
    icon: mdi:timer-outline
    fields:
      minutes:
        name: Minutes
        required: true
        selector:
          number: {min: 1, max: 720}
    sequence:
      - action: jbl_bar_91.timer_start
        target:
          entity_id: >-
            {{ integration_entities('jbl_bar_91') | select('match', 'media_player[.]') | first }}
        data:
          duration:
            minutes: "{{ minutes | int(1) }}"
          sound: unless_tv
  jbl_timer_stop_all:
    alias: Stop all timers
    icon: mdi:timer-off-outline
    sequence:
      - action: jbl_bar_91.timer_cancel
        target:
          entity_id: >-
            {{ integration_entities('jbl_bar_91') | select('match', 'media_player[.]') | first }}
        data:
          all: true
  jbl_timer_add_minute:
    alias: Add a minute to the next timer
    icon: mdi:timer-plus-outline
    sequence:
      - action: jbl_bar_91.timer_extend
        target:
          entity_id: >-
            {{ integration_entities('jbl_bar_91') | select('match', 'media_player[.]') | first }}
  jbl_timer_cancel_slot:
    alias: Cancel one timer
    icon: mdi:timer-cancel-outline
    fields:
      slot:
        name: Slot
        description: The number of sensor.jbl_timer_N, as on the card's line.
        required: true
        selector:
          number: {min: 1, max: 4}
    sequence:
      - variables:
          timer_id: "{{ state_attr('sensor.jbl_timer_' ~ (slot | int(0)), 'timer_id') }}"
      - condition: template
        value_template: "{{ timer_id not in [none, ''] }}"
      - action: jbl_bar_91.timer_cancel
        target:
          entity_id: >-
            {{ integration_entities('jbl_bar_91') | select('match', 'media_player[.]') | first }}
        data:
          id: "{{ timer_id }}"
