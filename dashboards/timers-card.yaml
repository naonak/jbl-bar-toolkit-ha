# JBL Bar Toolkit – timers card.
# In a dashboard: Edit > Add card > Manual, then paste.
# It needs the package timers-package.yaml. It finds the bar's entities itself:
# no entity id to adapt, whatever Home Assistant's language.
type: vertical-stack
cards:
  - type: entities
    title: Timers
    entities:
      - type: conditional
        conditions:
          - condition: state
            entity: button.jbl_timer_line_1
            state: unavailable
        row:
          type: text
          icon: mdi:timer-off-outline
          name: No timer running
          text: "–"
      - type: conditional
        conditions:
          - condition: state
            entity: button.jbl_timer_line_1
            state_not: unavailable
        row:
          entity: button.jbl_timer_line_1
      - type: conditional
        conditions:
          - condition: state
            entity: button.jbl_timer_line_2
            state_not: unavailable
        row:
          entity: button.jbl_timer_line_2
      - type: conditional
        conditions:
          - condition: state
            entity: button.jbl_timer_line_3
            state_not: unavailable
        row:
          entity: button.jbl_timer_line_3
      - type: conditional
        conditions:
          - condition: state
            entity: button.jbl_timer_line_4
            state_not: unavailable
        row:
          entity: button.jbl_timer_line_4
      - type: conditional
        conditions:
          - condition: state
            entity: button.jbl_timer_line_5
            state_not: unavailable
        row:
          entity: button.jbl_timer_line_5
      - type: conditional
        conditions:
          - condition: state
            entity: button.jbl_timer_line_6
            state_not: unavailable
        row:
          entity: button.jbl_timer_line_6
      - type: conditional
        conditions:
          - condition: state
            entity: button.jbl_timer_line_7
            state_not: unavailable
        row:
          entity: button.jbl_timer_line_7
      - type: conditional
        conditions:
          - condition: state
            entity: button.jbl_timer_line_8
            state_not: unavailable
        row:
          entity: button.jbl_timer_line_8
  - type: markdown
    show_empty: false
    content: |
      {%- set source = expand(integration_entities('jbl_bar_91'))
         | selectattr('attributes.timers', 'defined') | list %}
      {%- if source | count == 0 %}
      ⚠️ No *Timers* entity: the toolkit remote on the bar has no timers yet.
      Update it; the integration adds the timers by itself.
      {%- elif states.input_text.jbl_timer_name is none %}
      ⚠️ The timers package is missing: put timers-package.yaml in your
      packages folder, then restart Home Assistant (see the README).
      {%- else %}
      {%- set n = source[0].attributes.timers | count %}
      {%- if n > 8 %}
      And {{ n - 8 }} more: *Stop all timers* cancels them too.
      {%- endif %}
      {%- endif %}
  - type: grid
    columns: 2
    square: false
    cards:
      - type: button
        name: +1 min (next timer)
        icon: mdi:timer-plus-outline
        tap_action:
          action: perform-action
          perform_action: script.jbl_timer_add_minute
      - type: button
        name: Stop all timers
        icon: mdi:timer-off-outline
        tap_action:
          action: perform-action
          perform_action: script.jbl_timer_stop_all
          confirmation:
            text: Stop all timers?
  - type: grid
    columns: 4
    square: false
    cards:
      - type: button
        name: 1 min
        icon: mdi:timer-outline
        tap_action:
          action: perform-action
          perform_action: script.jbl_timer_quick
          data: {minutes: 1}
      - type: button
        name: 5 min
        icon: mdi:timer-outline
        tap_action:
          action: perform-action
          perform_action: script.jbl_timer_quick
          data: {minutes: 5}
      - type: button
        name: 10 min
        icon: mdi:timer-outline
        tap_action:
          action: perform-action
          perform_action: script.jbl_timer_quick
          data: {minutes: 10}
      - type: button
        name: 15 min
        icon: mdi:timer-outline
        tap_action:
          action: perform-action
          perform_action: script.jbl_timer_quick
          data: {minutes: 15}
  - type: entities
    title: Custom timer
    entities:
      - input_text.jbl_timer_name
      - input_number.jbl_timer_minutes
      - input_select.jbl_timer_sound
      - input_boolean.jbl_timer_show_time
      - type: button
        name: Start
        icon: mdi:timer-play-outline
        action_name: Start
        tap_action:
          action: perform-action
          perform_action: script.jbl_timer_start
