# JBL Bar Toolkit – timers card.
# In a dashboard: Edit > Add card > Manual, then paste.
# It needs the package timers-package.yaml. It finds the bar's entities itself:
# no entity id to adapt, whatever Home Assistant's language.
type: vertical-stack
cards:
  - type: markdown
    title: Timers
    content: |
      {%- set source = expand(integration_entities('jbl_bar_91'))
         | selectattr('attributes.timers', 'defined') | list %}
      {%- if source | count == 0 %}
      ⚠️ No *Timers* entity: this needs integration 0.7.0 and a bar remote
      with timers, then a reload of the integration.
      {%- else %}
      {%- set timers = source[0].attributes.timers %}
      {%- if timers | count == 0 %}
      No timer running.
      {%- endif %}
      {%- for t in timers %}
      - **{{ t.name or 'Timer' }}**:
        {%- if t.ringing %} 🔔 ringing, press any key on the JBL remote
        {%- elif t.ends_at %}
        {%- set left = ((as_timestamp(t.ends_at) - as_timestamp(now())) / 60) | round(0, 'ceil') | int %}
        ends at {{ as_timestamp(t.ends_at) | timestamp_custom('%H:%M') }}
        ({{ 'less than a minute' if left < 1 else 'in ' ~ left ~ ' min' }})
        {%- endif %}
      {%- endfor %}
      {%- endif %}
  - type: grid
    columns: 4
    square: false
    cards:
      - type: button
        name: 1 min
        icon: mdi:timer-outline
        tap_action:
          action: perform-action
          perform_action: script.jbl_timer_quick
          data: {minutes: 1}
      - type: button
        name: 5 min
        icon: mdi:timer-outline
        tap_action:
          action: perform-action
          perform_action: script.jbl_timer_quick
          data: {minutes: 5}
      - type: button
        name: 10 min
        icon: mdi:timer-outline
        tap_action:
          action: perform-action
          perform_action: script.jbl_timer_quick
          data: {minutes: 10}
      - type: button
        name: 15 min
        icon: mdi:timer-outline
        tap_action:
          action: perform-action
          perform_action: script.jbl_timer_quick
          data: {minutes: 15}
  - type: entities
    title: Custom timer
    entities:
      - input_text.jbl_timer_name
      - input_number.jbl_timer_minutes
      - input_select.jbl_timer_sound
      - input_boolean.jbl_timer_show_time
      - type: button
        name: Start
        icon: mdi:timer-play-outline
        action_name: Start
        tap_action:
          action: perform-action
          perform_action: script.jbl_timer_start
  - type: button
    name: Stop all timers
    icon: mdi:timer-off-outline
    tap_action:
      action: perform-action
      perform_action: script.jbl_timer_stop_all
      confirmation:
        text: Stop all timers?
