# JBL Bar Toolkit – timers card.
# In a dashboard: Edit > Add card > Manual, then paste.
# It needs the package timers-package.yaml. It finds the bar's entities itself:
# no entity id to adapt, whatever Home Assistant's language.
type: vertical-stack
cards:
  - type: entities
    title: Timers
    entities:
      - type: conditional
        conditions:
          - condition: state
            entity: sensor.jbl_timer_1
            state: unavailable
        row:
          type: text
          icon: mdi:timer-off-outline
          name: No timer running
          text: "–"
      - type: conditional
        conditions:
          - condition: state
            entity: sensor.jbl_timer_1
            state_not: unavailable
        row:
          type: button
          entity: sensor.jbl_timer_1
          action_name: Cancel
          tap_action:
            action: perform-action
            perform_action: script.jbl_timer_cancel_slot
            data: {slot: 1}
      - type: conditional
        conditions:
          - condition: state
            entity: sensor.jbl_timer_2
            state_not: unavailable
        row:
          type: button
          entity: sensor.jbl_timer_2
          action_name: Cancel
          tap_action:
            action: perform-action
            perform_action: script.jbl_timer_cancel_slot
            data: {slot: 2}
      - type: conditional
        conditions:
          - condition: state
            entity: sensor.jbl_timer_3
            state_not: unavailable
        row:
          type: button
          entity: sensor.jbl_timer_3
          action_name: Cancel
          tap_action:
            action: perform-action
            perform_action: script.jbl_timer_cancel_slot
            data: {slot: 3}
      - type: conditional
        conditions:
          - condition: state
            entity: sensor.jbl_timer_4
            state_not: unavailable
        row:
          type: button
          entity: sensor.jbl_timer_4
          action_name: Cancel
          tap_action:
            action: perform-action
            perform_action: script.jbl_timer_cancel_slot
            data: {slot: 4}
  - type: markdown
    show_empty: false
    content: |
      {%- set source = expand(integration_entities('jbl_bar_91'))
         | selectattr('attributes.timers', 'defined') | list %}
      {%- if source | count == 0 %}
      ⚠️ No *Timers* entity: this needs integration 0.7.0 and a bar remote
      with timers, then a reload of the integration.
      {%- elif states.sensor.jbl_timer_1 is none %}
      ⚠️ The timers package is missing: put timers-package.yaml in your
      packages folder, then restart Home Assistant (see the README).
      {%- elif source[0].attributes.timers | count > 4 %}
      And {{ source[0].attributes.timers | count - 4 }} more: *Stop all timers* cancels them too.
      {%- endif %}
  - type: grid
    columns: 2
    square: false
    cards:
      - type: button
        name: +1 min (next timer)
        icon: mdi:timer-plus-outline
        tap_action:
          action: perform-action
          perform_action: script.jbl_timer_add_minute
      - type: button
        name: Stop all timers
        icon: mdi:timer-off-outline
        tap_action:
          action: perform-action
          perform_action: script.jbl_timer_stop_all
          confirmation:
            text: Stop all timers?
  - type: grid
    columns: 4
    square: false
    cards:
      - type: button
        name: 1 min
        icon: mdi:timer-outline
        tap_action:
          action: perform-action
          perform_action: script.jbl_timer_quick
          data: {minutes: 1}
      - type: button
        name: 5 min
        icon: mdi:timer-outline
        tap_action:
          action: perform-action
          perform_action: script.jbl_timer_quick
          data: {minutes: 5}
      - type: button
        name: 10 min
        icon: mdi:timer-outline
        tap_action:
          action: perform-action
          perform_action: script.jbl_timer_quick
          data: {minutes: 10}
      - type: button
        name: 15 min
        icon: mdi:timer-outline
        tap_action:
          action: perform-action
          perform_action: script.jbl_timer_quick
          data: {minutes: 15}
  - type: entities
    title: Custom timer
    entities:
      - input_text.jbl_timer_name
      - input_number.jbl_timer_minutes
      - input_select.jbl_timer_sound
      - input_boolean.jbl_timer_show_time
      - type: button
        name: Start
        icon: mdi:timer-play-outline
        action_name: Start
        tap_action:
          action: perform-action
          perform_action: script.jbl_timer_start
